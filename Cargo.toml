[workspace.metadata.bin]
just = { version = "1" }

[workspace]
resolver = "3"
members = [
  "crates/cybflight",
  "crates/cybflight_core",
  "crates/cybflight_sim",
  "crates/bsp/sakurah743",
  "crates/bsp/foxeerh743",
  "crates/bsp/types",
  "crates/drivers",
]
# Host-target crates are excluded from the default `cargo build` (which
# targets thumbv7em-none-eabihf per .cargo/config.toml). Build them with
# --target x86_64-unknown-linux-gnu, e.g.
#   cargo build -p cybflight-sim --target x86_64-unknown-linux-gnu
default-members = [
  "crates/cybflight",
  "crates/cybflight_core",
  "crates/bsp/sakurah743",
  "crates/bsp/foxeerh743",
  "crates/bsp/types",
  "crates/drivers",
]

[profile.release]
debug = 2
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false

# Host-side profile for cybflight-sim. Inherits optimization from `release`
# but disables LTO and loosens codegen-units so incremental rebuilds don't
# pay the cross-crate LTO tax that the embedded firmware needs. Use via
# `cargo <cmd> --profile release-host`. Embedded builds still use `release`.
[profile.release-host]
inherits = "release"
lto = false
codegen-units = 16

[patch.utadr]
#cybflight-msgs = { path = "../cybflight-msgs" }
# Unify `block-device-driver` so embassy-stm32 (registry 0.2) and
# embedded-fatfs/block-device-adapters (same version, but pulled from
# git) talk about the *same* trait. Without this they appear as two
# distinct crates and `BufStream<StorageDevice<...>, 512>` won't impl
# `ReadWriteSeek`.
[patch.crates-io]
block-device-driver = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
