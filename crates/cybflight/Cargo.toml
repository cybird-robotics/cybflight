[package]
name = "cybflight"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Pick one board by default; enable CRSF RC and UART logging by default
default = ["board_foxeerh743", "rx_crsf", "defmt_uart", "outer_mpc", "est_pos_mocap", "postmortem"]

board_sakurah743 = ["dep:bsp-sakurah743"]
board_foxeerh743 = ["dep:bsp-foxeerh743"]
rx_crsf = []
rx_ghst = []
# Enable UART-based defmt logging. Disable for production to eliminate all
# blocking UART overhead and free USART2 (the peripheral is still consumed
# and dropped at init, but no bytes are ever transmitted).
defmt_uart = []
# Controller mode — exactly one must be selected:
#
# outer_rate:      INDI inner loop + manual rate control (RC sticks → rate_ref).
# outer_geometric: INDI + cascade position→attitude→geometric controller.
# outer_mpc:       INDI + SQP/MPC outer loop at 50 Hz.
#
# Mahony attitude filter always runs (gyro bias for INDI).
# outer_geometric and outer_mpc auto-enable est_eskf (ESKF position/velocity
# estimation required for their outer loops).
#
# Position source for the ESKF — exactly one must be selected when est_eskf
# is on (outer_geometric and outer_mpc default to est_pos_mocap so existing
# bench configurations keep working unchanged):
#   est_pos_mocap:  VICON_POSE channel (ESP32 bridge, lab / HIL).
#   est_pos_gps:    GPS_FIX channel (u-blox M10 NAV-PVT, outdoor flight).
est_eskf = []
est_pos_mocap = ["est_eskf"]
est_pos_gps = ["est_eskf"]
outer_rate = []
outer_geometric = ["est_eskf"]
outer_mpc = ["est_eskf"]
# Post-mortem logging subsystem (BKPSRAM + flash mirror + custom panic
# handler). Default-on for release / firmware builds — captures crash
# state across reboots and brownouts. Disable for `probe-rs run`
# debug sessions if you want panic_probe's breakpoint-on-panic flow
# (cargo run --no-default-features --features=...without postmortem).
# When this feature is on, `panic_probe` is NOT linked.
postmortem = []
# Reference sampler selection (only meaningful with outer_mpc).
# Default: TimeSampler (τ = (now − t_start) + k·dt). Setting this flag
# selects the closest-point PositionSampler — see docs in
# `cybflight_core::trajectory_planning::sampler`.
position_sampler = []
# Forward raw, ESKF-internal sensor channels (raw IMU, mag, baro, secondary
# IMU/baro/mag) over the ESP32 telemetry link. Off by default — these
# channels exist for offline calibration / sensor-health debugging only;
# the ESKF consumes them internally and the rerun viewport does not need
# them at flight time. See the audit comment at the top of
# `comm/esp_bridge.rs` for bandwidth justification.
dev_telem = []

[dependencies]
bsp-sakurah743 = { path = "../bsp/sakurah743", optional = true }
bsp-foxeerh743 = { path = "../bsp/foxeerh743", optional = true }
bsp-types = { path = "../bsp/types" }
cybflight-drivers = { path = "../drivers" }
cybflight-msgs = { version = "0.1.18", registry = "utadr", features = ["embedded"] }
cybflight-core = { path = "../cybflight_core/" }

# Embassy runtime pieces (board-agnostic)
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time     = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync     = { version = "0.7.2", features = ["defmt"] }
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embedded-hal = "1.0"
embassy-futures = "0.1.2"
embassy-usb = { version = "0.5", default-features = false }
embedded-io-async = "0.7"
static_cell = "2"

# cortex-m-rt needed by embassy_executor::main
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

# Logging + panic
defmt = "1.0.1"
critical-section = "1"
embedded-io = "0.7"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
# CRC over the post-mortem record body. `default-features = false`
# disables std-only "use_simd" path; the no_std fallback is the
# table-based implementation which is still callable from a
# panic/HardFault context (no allocator, no statics-with-Drop).
crc32fast = { version = "1.5", default-features = false }

# COBS framing for ESP bridge communication
cobs = { version = "0.5", default-features = false }

# Math (no_std)
nalgebra = { version = "0.34.1", default-features = false, features = ["libm", "defmt"] }
air-filters = { version = "0.0.5", default-features = false, features = ["libm"] }
discrete_pid = { version = "0.1.0", default-features = false }
libm = "0.2"
heapless = "0.9.2"

# FAT filesystem layer above the BlockStore stack — used by `touch_sd`
# and (eventually) the MCAP recorder so logs land as real files visible
# in a desktop file manager.
#
# Both crates pinned to the same git rev so their `embedded-io-async`
# bound is exactly 0.7 — the published `block-device-adapters` 0.2.0 on
# crates.io still uses 0.6.1 and won't unify with the rest of our
# graph. `embedded-fatfs` on crates.io (0.0.0) is a placeholder.
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112", default-features = false, features = ["lfn"] }
block-device-adapters = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
# Most SD cards ship with an MBR + FAT32 partition (not a "superfloppy"
# FAT BPB at LBA 0). embedded-fatfs alone reads sector 0 expecting a
# BPB, so we route through embedded-partitions to find the FAT
# partition's LBA and slice the stream into it before mounting.
embedded-partitions = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112" }
aligned = "0.4"
