[package]
name = "cybflight"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Pick one board by default; enable CRSF RC and UART logging by default
default = ["board_sakurah743", "rx_crsf", "defmt_uart", "est_mahony"]

board_sakurah743 = ["dep:bsp-sakurah743"]
board_foxeerh743 = ["dep:bsp-foxeerh743"]
rx_crsf = []
rx_ghst = []
# Enable UART-based defmt logging. Disable for production to eliminate all
# blocking UART overhead and free USART2 (the peripheral is still consumed
# and dropped at init, but no bytes are ever transmitted).
defmt_uart = []
# est_mahony: Mahony attitude filter → angle-mode stick control.
# est_eskf:   ESKF (IMU + Vicon) → full ENU position control.
# Exactly one must be selected.
est_mahony = []
est_eskf = []

[dependencies]
bsp-sakurah743 = { path = "../bsp/sakurah743", optional = true }
bsp-foxeerh743 = { path = "../bsp/foxeerh743", optional = true }
bsp-types = { path = "../bsp/types" }
cybflight-drivers = { path = "../drivers" }
cybflight-msgs = { version = "0.1.8", registry = "utadr", features = ["embedded"] }
cybflight-core = { path = "../cybflight_core/" }

# Embassy runtime pieces (board-agnostic)
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time     = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync     = { version = "0.7.2", features = ["defmt"] }
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embedded-hal = "1.0"
embassy-futures = "0.1.2"
embassy-usb = { version = "0.5", default-features = false }
embedded-io-async = "0.7"
static_cell = "2"

# cortex-m-rt needed by embassy_executor::main
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

# Logging + panic
defmt = "1.0.1"
critical-section = "1"
embedded-io = "0.7"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# COBS framing for ESP bridge communication
cobs = { version = "0.5", default-features = false }

# Math (no_std)
nalgebra = { version = "0.34.1", default-features = false, features = ["libm", "defmt"] }
air-filters = { version = "0.0.3", default-features = false, features = ["libm"] }
discrete_pid = { version = "0.1.0", default-features = false }
libm = "0.2"

[profile.release]
debug = 2
lto = "thin"
codegen-units = 1
