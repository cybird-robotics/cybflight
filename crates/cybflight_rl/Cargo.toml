[package]
license = "Apache-2.0"
repository = "https://github.com/cybird-robotics/cybflight"
name = "cybflight-rl"
version = "0.1.0"
edition = "2024"
publish = false

# Python bridge for the recovery-episode environment (docs/learned_mpc_cost.md).
# Host-only; built with `maturin develop --release` from this directory.
# Workspace member but not a default member, so the embedded build never sees pyo3.

[lib]
name = "cybflight_rl"
crate-type = ["cdylib"]

[dependencies]
cybflight-core = { path = "../cybflight_core" }
cybflight-sim = { path = "../cybflight_sim" }
vehicle-yaml = { path = "../vehicle_yaml" }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
rayon = "1.10"
