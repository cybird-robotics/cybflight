[package]
name = "cybflight-sim"
version = "0.1.0"
edition = "2024"
publish = false

# Host-side simulation harness. Not built by the default workspace target
# (thumbv7em-none-eabihf) — invoke with `--target x86_64-unknown-linux-gnu`.

[dependencies]
cybflight-core = { path = "../cybflight_core" }
vehicle-yaml = { path = "../vehicle_yaml" }
# Same biquad the firmware's `indi_task` uses to build `omega_fs` — the sim
# must filter ESC telemetry through the identical filter or INDI's
# sync-dependent `dv = sp − fs` is computed at a different effective time.
air-filters = { version = "0.0.5", default-features = false, features = ["libm"] }
nalgebra = { version = "0.34.1", features = ["std", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rerun = { version = "0.26", default-features = false, features = ["sdk"] }
clap = { version = "4", features = ["derive"] }
num-traits = "0.2.19"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
rand_chacha = "0.9"
rand_distr = "0.5"
serde_yaml = "0.9"

[[bin]]
name = "sim-run"
path = "src/bin/sim_run.rs"
