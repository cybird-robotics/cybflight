[package]
name = "cybflight-drivers"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cybflight-msgs = { version = "0.1.19", registry = "utadr" }
embedded-hal = "1.0"
embedded-hal-async = "1.0"
defmt = "1.0.1"
nalgebra = { version = "0.34.1", default-features = false, features = ["libm"] }
libm = "0.2"
embedded-io-async = "0.7"

# Unicore UM982 driver core (no_std). Optional — compiled only for
# `--features gps_unicore`.
um982 = { git = "https://github.com/UTADR/um982", optional = true }

[features]
# Swap the GPS driver from u-blox (default) to the Unicore UM982.
gps_unicore = ["dep:um982"]
