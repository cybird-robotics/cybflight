# Vehicle definition: FOXEERH743 bench quad. Same airframe placeholder
# values as sakura_bench; the tuning block restores this board's
# historical IMU LPF cutoffs (20/150 Hz vs the schema default 80/200).
# Copy this file into vehicles/ before selecting VEHICLE=foxeer_bench.

# Compile-time build selections (see sakura_vicon.yaml for the policy).
# Matches the cargo default feature set — this vehicle is the bare
# `cargo check` / rust-analyzer fallback.
build:
  board: foxeerh743
  rc_protocol: crsf
  outer_loop: mpc          # mpc | mpc_full | cascade | rate
  pos_source: mocap
  imu_rate: 8khz           # 8khz | 1khz (ICM low-noise mode, 1 kHz inner loop)
  indi: yes                # yes | no — `no` degrades the inner loop to a plain rate
                           #   controller (under mpc_full: to static inversion — bench only)

# Default offline mission (see sakura_vicon.yaml for the policy).
default_mission: indoor_splits_slow

airframe:
  # Thrust-to-command model (REQUIRED, hardware identity like mass).
  # Placeholder: same bench table as sakura_bench — replace with this
  # airframe's own bench data before flight.
  thrust_model: { type: table, table: a2rl_0114 }
  mass_kg: 0.6
  inertia_kg_m2: [0.0021, 0.0, 0.0, 0.0, 0.0018, 0.0, 0.0, 0.0, 0.003]
  max_rate_rad_s: [10.0, 10.0, 6.0]
  motors:
    - { pos_m: [-0.075, -0.1], spin: cw,  max_thrust_n: 12.0, torque_coeff_m: 0.022 }
    - { pos_m: [ 0.075, -0.1], spin: ccw, max_thrust_n: 12.0, torque_coeff_m: 0.022 }
    - { pos_m: [-0.075,  0.1], spin: ccw, max_thrust_n: 12.0, torque_coeff_m: 0.022 }
    - { pos_m: [ 0.075,  0.1], spin: cw,  max_thrust_n: 12.0, torque_coeff_m: 0.022 }

tuning:
  # Keys here are flat registry names, and the heading above each block
  # names the schema group they belong to (`param list`, docs/parameters.md).
  # Group is not the same axis as section: every key below arrives through
  # `tuning:` whatever its group, because the `airframe:` block above carries
  # only the required identity that has no default.

  # ── sensors — IMU software LPF cutoffs ──
  # This board's historical values.
  imu_accel_lpf_hz: 20.0
  imu_gyro_lpf_hz: 150.0

  # ── airframe.motors + battery + sensors — hardware-coupled, pin per vehicle (see sakura_vicon.yaml for the policy) ──
  # Placeholder values copied from sakura_bench — identify on the bench
  # for this airframe before flight.
  m0_tau: 0.02
  m1_tau: 0.02
  m2_tau: 0.02
  m3_tau: 0.02
  m0_omega_max: 4188.79
  m1_omega_max: 4188.79
  m2_omega_max: 4188.79
  m3_omega_max: 4188.79
  m0_g2_ry: 0.001
  m1_g2_ry: -0.001
  m2_g2_ry: -0.001
  m3_g2_ry: 0.001
  batt_nominal_v: 23.0
  batt_min_v: 12.0
  batt_max_v: 30.0
  pos_kp_x: 4.0
  pos_kp_y: 4.0
  pos_kp_z: 8.0
  pos_kd_x: 4.0
  pos_kd_y: 4.0
  pos_kd_z: 6.0
  att_k_r: 3.0
  att_k_p: 3.0
  att_k_y: 1.0

  # ── eskf.filter — process/measurement noise + jump gates ──
  # Full EskfConfig surface — noise model AND the outlier gates. No
  # estimator threshold is a hidden code constant.
  eskf_acc_noise: 0.01           # accel noise density [m/s^2/sqrt(Hz)]
  eskf_gyro_noise: 0.0001        # gyro noise density [rad/s/sqrt(Hz)]
  eskf_acc_bias_rw: 0.001        # accel bias random walk
  eskf_gyro_bias_rw: 0.00001     # gyro bias random walk
  # INACTIVE on this build: the mocap estimation task subscribes only to
  # IMU_1 and VICON_POSE — no baro or magnetometer fusion. Stated for the
  # POS_SOURCE=gps dev override, same policy as the GPS-guard block.
  eskf_baro_std: 0.5             # baro 1-sigma [m]
  eskf_mag_std: 0.05             # magnetometer 1-sigma
  eskf_gate_sigma: 10.0          # Mahalanobis gate [sigma/dim]; lower = stricter
  # Absolute jump reject gates. POSITION-SOURCE COUPLED: 1 m suits mocap
  # (10 m/s worst-case flight x 100 ms worst-case latency). 0.7 rad
  # (~40 deg) catches rigid-body re-association flips while sitting above
  # any plausible inter-frame attitude change.
  eskf_max_pos_jump_m: 1.0
  eskf_max_att_jump_rad: 0.7

  # ── eskf.mocap_guard — mocap acceptance ──
  # Failsafe cascade limits. Mocap deliberately does NOT re-init on a
  # jump cascade (unlike GPS): a jump almost always means the volume
  # re-associated onto a different rigid body, and IMU dead-reckoning is
  # the more trustworthy source. Raising these widens the window in which
  # a misidentified pose keeps steering the filter.
  eskf_mocap_max_jumps: 3        # binary fault (right body vs wrong body)
  eskf_mocap_max_rejects: 8      # ~25-80 ms at 100-360 Hz
  # Staleness — COUPLE THIS TO THE STREAM RATE. 0.1 s assumes 100-360 Hz;
  # a slower Vicon/Optitrack config needs a larger value.
  eskf_mocap_stale_s: 0.1
  eskf_mocap_bias_cov_thresh: 0.003   # 3-axis trace (mocap observes all axes)
  # Pose measurement sigma. INSTALL-SPECIFIC: camera count, volume size
  # and marker spread all move these. Unlike GPS (sigma per fix from
  # h_acc), mocap sigma is static — these two numbers are the entire
  # statement of how much the filter trusts the volume.
  eskf_mocap_pos_std: 0.01
  eskf_mocap_att_std: 0.03
  # Disarmed re-anchor radius. Once the jump cascade has wedged the
  # filter it cannot heal on its own — every pose stays outside the jump
  # gate forever — so a disarmed airframe whose pose stream agrees with
  # itself to within this radius re-seeds the ESKF. Keep it well above
  # eskf_mocap_pos_std and well below eskf_max_pos_jump_m. Never applies
  # in flight.
  eskf_mocap_reanchor_m: 0.10

  # ── eskf.gps_guard — GNSS acceptance + sigma schedule (INACTIVE on this build) ──
  # pos_source is mocap, so the GPS guard is never constructed here.
  # Stated anyway, for the same reason the cascade gains are stated under
  # outer_loop: mpc — POS_SOURCE=gps is a supported dev override
  # (tools/vehicle_features.sh), and such a build must not silently
  # inherit invisible schema defaults. Values are the reviewed defaults;
  # re-tune against the actual receiver and site before flying GPS.
  # (GPS antenna extrinsics are deliberately NOT stated: this airframe
  # carries no GPS antenna, so a lever arm here would be a fabricated
  # fact rather than an unstated one.)
  eskf_gps_max_jumps: 5
  eskf_gps_max_rejects: 15
  eskf_gps_stale_s: 2.0
  eskf_gps_rtk_fix_debounce_s: 2.0
  eskf_gps_rtk_loss_debounce_s: 1.0
  eskf_gps_bias_cov_thresh: 0.002
  eskf_gps_init_yaw_cov: 10.0
  eskf_gps_min_sv: 6
  eskf_gps_h_acc_max_m: 50.0
  eskf_gps_pos_sigma_fix_m: 0.05
  eskf_gps_pos_sigma_float_m: 0.30
  eskf_gps_pos_sigma_none_m: 2.0
  eskf_gps_vel_sigma_m_s: 0.10
  # A non-RTK receiver MUST set this to 0, else a jump cascade can never
  # re-init and the guard only ever disarms.
  eskf_gps_reinit_min_carr_soln: 2
  eskf_gps_heading_sigma_floor_rad: 0.025

  # ══ Pinned schema defaults ═════════════════════════════════════════
  # Written out explicitly so no flight-relevant value is inherited
  # invisibly. These are the values this vehicle already flies — pinning
  # them changes nothing today, but a future schema retune can no longer
  # move them silently underneath a flying airframe.
  #
  # Deliberately NOT pinned: the 24 g1_* and 4 m*_nonlin keys are
  # all-zero sentinels meaning "derive geometrically from the airframe",
  # so literal zeros there would read as measured data. Mission selection
  # is expressed once as `default_mission:` above.

  # ── airframe.install + sensors — install calibration + fusion policy (INACTIVE on this build) ──
  # No mag fusion and no GNSS on a mocap build; see the note above.
  mag_hi_x: 0
  mag_hi_y: 0
  mag_hi_z: 0
  gps_fuse_vel: 1   # 0/1

  # ── eskf.filter — initial covariance P0 ──
  # POSITION-SOURCE COUPLED. Set the position variance to the bootstrap
  # source's own accuracy squared: the filter is seeded directly from a
  # mocap pose, so that is eskf_mocap_pos_std^2 = 1e-4, not the 1 m^2
  # the GPS vehicles carry. Leaving it at 1 tells the filter its own
  # seed is 100x worse than the measurements that follow, and it snaps
  # to the first few frames.
  eskf_init_pos_var: 1e-4
  # Velocity is NOT directly measured by mocap (it is inferred from the
  # pose sequence) and init() seeds it at zero, so this stays generous —
  # it also covers an in-flight re-init, where true velocity is nonzero.
  eskf_init_vel_var: 1
  eskf_init_acc_bias_var: 0.01
  eskf_init_gyro_bias_var: 0.01
  eskf_init_att_var_rp: 0.1

  # ── eskf.faults — fault annunciation windows ──
  # POSITION-SOURCE COUPLED — these were GPS-scale. A 2 s stale window is
  # 200-700 dropped frames at 100-360 Hz, i.e. 20x the mocap guard's own
  # eskf_mocap_stale_s, so POS_STALE would annunciate long after the
  # guard had already given up. 25 m^2 is a 5 m 1-sigma, larger than the
  # arena itself.
  eskf_fault_pos_timeout_s: 0.3
  eskf_fault_cov_blowup_m2: 1.0
  eskf_fault_nan_hold_s: 3
  eskf_fault_cascade_hold_s: 3

  # ── battery — cell detection ──
  batt_cell_detect_v: 4.3
  # Cell-count ceiling for the auto-detector. Pack-coupled: a
  # larger pack would be silently clamped to this rather than
  # reported, so it is stated per vehicle.
  batt_max_cells: 8
  batt_no_battery_v: 3

  # ── rc — transmitter / stick configuration ──
  rc_min_us: 988
  rc_mid_us: 1500
  rc_max_us: 2012
  rc_arm_channel: 5
  rc_arm_threshold_us: 1500
  rc_throttle_mincheck_us: 1050
  rc_mission_channel: 4
  rc_mission_high_us: 1700
  rc_mission_low_us: 1300
  rc_throttle_land_us: 1100
  rc_launch_us: 1600
  rc_launch_confirm_frames: 5
  rc_xy_deadband: 0.05
  rc_throttle_deadband: 0.12
  rc_rate_deadband: 0.05
  rc_xy_rate_m_s: 1
  rc_z_rate_m_s: 0.5
  rc_land_rate_m_s: 0.4
  rc_max_rate_rp: 8
  rc_max_rate_yaw: 4

  # ── site — gravity and stick-integrator envelope ──
  # Local g. Read by both MPC models, the planner, the cascade, the
  # arming accel gate and the INDI ground-contact test — pin the value
  # for your latitude rather than inheriting the 9.81 default.
  gravity_m_s2: 9.81
  fence_enable: 1   # 0 = off, 1 = on
  fence_x_m: 2.5
  fence_y_m: 3.5
  fence_z_max_m: 2
  fence_z_min_m: 0

  # ── safety — arming gates ──
  arm_max_tilt_deg: 30
  arm_min_link_quality: 50
  arm_eskf_mahony_tol_deg: 10
  arm_accel_tol_m_s2: 1.5
  arm_gyro_limit_rad_s: 0.5
  arm_switch_hold_s: 0.1
  arm_link_stats_max_age_s: 0.5
  arm_led: 1   # 0/1 — NB: `system` group, not a safety gate

  # ── safety — RC-loss failsafe timing ──
  fs_rxloss_trigger_s: 0.15
  fs_guard_period_s: 1.5
  fs_recovery_period_s: 0.5
  fs_ctrl_timeout_s: 0.5

  # ── airframe.motors — G2 roll/pitch effectiveness ──
  m0_g2_rr: 0
  m0_g2_rp: 0
  m1_g2_rr: 0
  m1_g2_rp: 0
  m2_g2_rr: 0
  m2_g2_rp: 0
  m3_g2_rr: 0
  m3_g2_rp: 0

  # ── indi.controller — rate gains, sync filter, WLS weights ──
  indi_rate_r: 80
  indi_rate_p: 80
  indi_rate_y: 80
  indi_sync_hz: 12
  indi_ctrl_div: 4             # 8 kHz IMU / 4 = 2 kHz INDI (reboot)
  wls_wv_fx: 1
  wls_wv_fy: 1
  wls_wv_fz: 50
  wls_wv_rr: 50
  wls_wv_rp: 50
  wls_wv_ry: 5
  wls_wu_m0: 1
  wls_wu_m1: 1
  wls_wu_m2: 1
  wls_wu_m3: 1

  # ── indi.controller — idle throttle + ground detection ──
  indi_idle_norm: 0.055
  indi_ground_gyro_dps: 100
  indi_ground_accel_g: 0.8
  indi_ground_thrust_sp: 3

  # ── indi.controller — RPM feedback source + liveness ──
  # indi_omega_kf: which ω/ω̇ reaches the incremental law. 0 = the dshot
  # value held through dropouts (what this vehicle has flown); 1 = the
  # RPM Kalman filter's estimate through the same low-pass. Both share
  # the biquad, so indi_sync_hz means the same thing either way and the
  # two are directly comparable in an A/B flight.
  #
  # Pinned 0 until m*_omega_max and m*_tau above are *identified* rather
  # than inherited defaults: the KF bridges telemetry gaps with the motor
  # model, so a wrong model yields a confidently wrong ω, where the hold
  # merely yields a stale one. Flip to 1 once they are measured.
  indi_omega_kf: 0   # 0/1
  # Missed *expected* telemetry intervals before a motor's ω is stale
  # (G2 off for that motor; all four ⇒ ω̇ from the motor model). The
  # expected interval is derived from ω, so one number holds across the
  # RPM range. Size it above the longest consecutive `no_reply` run this
  # ESC link produces — see DshotMotorHealth. 10 suits a ≤1% error rate.
  indi_rpm_stale_gaps: 10

  # ── indi.rpm_estimator — per-motor FOPDT Kalman filter ──
  # Measurement variance on ω, i.e. sigma^2. 400 = sigma 20 rad/s ~ 1%
  # commutation asymmetry at omega ~ 2000 rad/s. This ESC firmware sends a
  # single *unaveraged* 60 deg electrical step, so asymmetry dominates and
  # the true value scales with omega — sized at high thrust rather than
  # hover because R is constant while the noise is not, and a too-tight
  # gate during maneuvers is the costly direction. Provisional: measure the
  # spread of `raw` in MotorStateTelemetry at steady throttle, and read
  # nis_reject/passed in DshotHealth (should match the chi-squared rate for
  # rpm_est_nis_gate — 0.27% at 9.0 — when R is right for that omega).
  rpm_est_omega_var: 400
  # Throttle-error intensity (spectral density in seconds — not a per-step
  # variance, so it means the same at 8 kHz and 1 kHz). This is the knob
  # that buys down *model* error: simulated-optimal at ~25% m*_tau error,
  # which is the honest assumption while m*_tau is still a default. Drop
  # toward 1.25e-8 once the time constants are identified — that is worth
  # ~3x better omega than the ZOH path, versus ~25% today.
  rpm_est_thr_psd: 1.25e-6
  # How fast the estimated full-throttle speed c_m may follow pack sag.
  # c_m is the throttle->omega gain, so it tracks pack voltage: a 6S pack
  # sagging 25.2 -> 21.0 V over a 3 min flight moves it ~17%. At 0.1 the
  # filter cannot follow that (48 rad/s of standing lag); 100 leaves 2.5.
  # Broad optimum, and it does not loosen the NIS gate.
  rpm_est_cm_psd: 100
  # NIS gate (χ², 1 DOF): 9.0 ≈ 3σ. Watch `nis_reject` after changing it.
  rpm_est_nis_gate: 9
  # Throttle → ω transport delay. 0 = use the newest command.
  rpm_est_tau_d: 0

  # ── rpm_notch — gyro/accel notch bank ──
  rpm_notch_en: 0   # 0/1
  rpm_notch_q: 5
  rpm_notch_min_hz: 100
  rpm_notch_fade_hz: 50
  rpm_notch_lpf_hz: 150

  # ── cascade — geometric cascade (inactive under outer_loop: mpc) ──
  att_kt_r: 0
  att_kt_p: 0
  att_kt_y: 0
  cascade_rate_hz: 100

  # ── mpc — cost weights and solve cadence ──
  mpc_w_pos_x: 500
  mpc_w_pos_y: 500
  mpc_w_pos_z: 100
  mpc_w_vel_x: 10
  mpc_w_vel_y: 10
  mpc_w_vel_z: 10
  mpc_w_att_r: 5
  mpc_w_att_p: 5
  mpc_w_att_y: 200
  mpc_w_rate_r: 20
  mpc_w_rate_p: 20
  mpc_w_rate_y: 20
  mpc_w_thrust: 1
  mpc_dt: 0.05
  mpc_rho: 10000
  mpc_thrust_frac: 0.75
  mpc_pos_cost_mode: 1   # 0 = Quadratic, 1 = Contouring
  mpc_rate_hz: 50
  # ── mpc — SQP solver knobs ──
  # max_iters = 1 is RTI (one warm-started Newton step per tick, the
  # flight configuration); kkt_tol only labels convergence at 1 iter.
  mpc_max_iters: 1
  # Active SQP horizon in stages (mpc_dt apart); 20 = the full solver
  # workspace. Shortening only — lowers solve time ~linearly.
  mpc_horizon_n: 20
  mpc_kkt_tol: 0.001
  # Body-rate state-constraint barrier (FullQuadModel only; the reduced
  # outer-loop model bounds rates as inputs). tau = 0 disables. 0.5/0.5
  # validated by the closed-loop stress suite
  # (docs/mpc_runtime_comparison.md).
  mpc_rate_barrier_tau: 0.5
  mpc_rate_barrier_delta: 0.5
  # Maximum-tilt state constraint (both MPC models) — an envelope fence
  # keeping the predicted trajectory away from deep tilt, where the local
  # SQP has a free-fall stationary point (~100°; all motors corner at
  # zero). tau = 0 disables. Fence semantics only: it bounds what the
  # controller *chooses*, not what disturbances impose. delta is in cos
  # units (0.05 = 3.3 deg margin at a 60 deg limit). Raise
  # mpc_tilt_max_deg before flying maneuvers that legitimately need more
  # tilt (60 deg caps horizontal accel at ~1.7 g).
  mpc_tilt_max_deg: 60.0
  mpc_tilt_barrier_tau: 0.5
  mpc_tilt_barrier_delta: 0.05

  # ── trajectory.planner — online BFGS planner (inactive: USE_OFFLINE_PLAN) ──
  # Arena-scale, not the outdoor vehicles' 100 m/s: this airframe flies
  # in a ~5 x 7 x 2 m volume. Inert while USE_OFFLINE_PLAN is set, but a
  # vehicle file should not state a false fact about the airframe.
  plan_max_vel: 5
  plan_max_tilt: 1.0471976
  plan_w_time: 1
  plan_w_energy: 0.01
  plan_w_vel: 0
  plan_w_tilt: 0
  plan_w_body_rate: 10
  plan_w_thrust: 10
  plan_smooth_eps: 0.01
  plan_num_check: 8
  plan_bfgs_delta_init: 1
  plan_bfgs_delta_max: 100
  plan_bfgs_eta: 0.1
  plan_bfgs_g_eps: 1e-07
  plan_bfgs_max_iter: 500
  plan_bfgs_past: 3
  plan_bfgs_delta_conv: 1e-08

  # ── trajectory.sampler — reference sampler ──
  sampler_kind: 1   # 0 = Time, 1 = Position
  sampler_max_lag_s: 0.1
  sampler_axis_weights_sqrt_x: 1
  sampler_axis_weights_sqrt_y: 1
  sampler_axis_weights_sqrt_z: 1
  sampler_search_dt: 0.01
  sampler_max_search_steps: 100
  sampler_radius_of_acceptance: 0.15
  sampler_max_lead_s: 0.1

  # ── system — device/UX toggles ──
  blackbox_tier: 3   # record-set tier
